apiVersion: v1
kind: Service
metadata:
  name: youtube-mood-frontend
  namespace: youtube-mood
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  selector:
    app: youtube-mood-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
